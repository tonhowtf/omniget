[package]
name = "omniget-asset3d"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0"
description = "Import normalizer for the 3D city: GLB/glTF/VRM/OBJ and 2D images in, one small meshopt GLB out (grid scale, triangle budget, WebP textures, footprint, anchors), plus .vox export"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
gltf = { version = "1.4", default-features = false, features = ["names", "extras", "utils", "KHR_materials_unlit", "KHR_texture_transform"] }
tobj = { version = "4", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
webp = { version = "0.3", default-features = false }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dot_vox = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["time", "process", "rt"] }
flate2 = "1"
tar = "0.4"

[build-dependencies]
cc = "1"
