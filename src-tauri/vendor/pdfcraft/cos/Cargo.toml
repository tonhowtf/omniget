[package]
name = "pdfcraft-cos"
version = "0.18.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/pdfcraft"
publish = false
autoexamples = false
autotests = false
autobenches = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
pdfcraft-crypt = { path = "../crypt" }
pdfcraft-filters = { path = "../filters" }
thiserror = "2"

[lints.clippy]
all = "allow"
