# cargo-nextest settings (https://nexte.st). Each test runs in its own process,
# in parallel across all cores; `cargo test` keeps working unchanged.
[profile.default]
fail-fast = false
# Flag slow tests and stop a stuck one instead of hanging the run.
slow-timeout = { period = "30s", terminate-after = 4 }
status-level = "fail"
final-status-level = "slow"

[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
