[package]
name = "omniget-core"
version = "0.2.16"
edition = "2021"

[lib]
name = "omniget_core"

[features]
default = ["heic"]
heic = ["dep:heic-rs"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "http2", "gzip", "brotli", "deflate", "rustls-tls", "multipart", "socks"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
m3u8-rs = "6"
aes = "0.8"
cbc = "0.1"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sanitize-filename = "0.6"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
urlencoding = "2"
rand = "0.10.0"
base64 = "0.22.1"
sha2 = "0.10"
hmac = "0.12"
murmur3 = "0.5"
ttf-parser = "0.25"
md-5 = "0.10"
hex = "0.4"
once_cell = "1"
thiserror = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rquickjs = { version = "0.14", features = ["classes", "properties"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
minisign-verify = "0.2"
shell-words = "1"
tar = "0.4"
flate2 = "1"
quick-xml = "0.38"
encoding_rs = "0.8"
xz2 = { version = "0.1", features = ["static"] }
walkdir = "2"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-27"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
tempfile = "=3.27.0"
zstd = "0.13"
sha1 = "0.10"
lofty = "0.25"
ebur128 = "0.1"
rustfft = "6"
trash = "5"
sysinfo = "0.39.6"
roxmltree = "0.21.1"
serde_yaml = "0.9.34"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
ctr = "0.9"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
blake3 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
ring = "0.17"
crc32fast = "1"
num-bigint = "0.4"
grammers-client = { version = "0.8", features = ["proxy"] }
grammers-session = "0.8"
grammers-tl-types = "0.8"
grammers-mtsender = { version = "0.8", features = ["proxy"] }
os_info = "3"
sys-locale = "0.3"
async-stream = "0.3"
bytes = "1"
dashmap = "6"
cipher = "0.4"
filetime = "0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
scraper = "0.27"
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
chardetng = "0.1"
alacritty_terminal = "0.26.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff", "tga"] }
csv = "1"
toml = { version = "0.8", features = ["preserve_order"] }
plist = "1"
heic-rs = { version = "=0.1.4", optional = true }
jxl-oxide = { version = "0.12.6", features = ["image", "moxcms"] }
photocraft-psd = "=0.20.1"
visioncortex = "0.8.10"
resvg = "0.49"
rawler = "0.8.0"
kamadak-exif = "0.6.1"
acadrust = { version = "0.6.8", default-features = false }
pdfcraft-organize = "=0.18.1"
pdfcraft-cos = "=0.18.1"
pdfcraft-filters = "=0.18.1"
suppaftp = { version = "12.2", default-features = false, features = ["tokio-rustls-ring"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"

[dev-dependencies]
libunftp = { version = "0.24", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4"
unftp-core = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
