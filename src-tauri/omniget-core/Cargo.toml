[package]
name = "omniget-core"
version = "0.2.16"
edition = "2021"

[lib]
name = "omniget_core"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "http2", "gzip", "brotli", "deflate", "rustls-tls", "multipart"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
m3u8-rs = "6"
aes = "0.8"
cbc = "0.1"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sanitize-filename = "0.6"
unicode-normalization = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
urlencoding = "2"
rand = "0.10.0"
base64 = "0.22.1"
sha2 = "0.10"
hmac = "0.12"
murmur3 = "0.5"
md-5 = "0.10"
hex = "0.4"
once_cell = "1"
thiserror = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
walkdir = "2"
# ONNX Runtime: "load-dynamic" NAO linka nada no build; a lib nativa e um
# binario gerido, baixado sob demanda.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-27"] }
# core/assist: bots, memória pessoal, leitura, sessões e recibos em SQLite
# (mesma versão/feature do crate do app, então compila uma vez só).
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "=3.25.0"
# washmybelly: Trash for files the person recognises (apps, documents).
trash = "5"
# washmybelly: monitor (sysinfo), CleanerML (roxmltree), privacy.sexy YAML,
# duplicate hashing (xxh3).
sysinfo = "0.39.6"
roxmltree = "0.21.1"
serde_yaml = "0.9.34"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# washmybelly: elevation (UAC), registry, services, power and the Restart
# Manager on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Power", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Performance", "Win32_System_ApplicationInstallationAndServicing", "Win32_Devices_DeviceAndDriverInstallation"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
