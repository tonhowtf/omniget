# cargo-deny, advisories only (RustSec): known vulnerabilities, unsound and
# unmaintained crates, yanked versions. Licenses, bans and sources are not
# checked here. Run by hand:
#
#   cargo deny --manifest-path src-tauri/Cargo.toml check advisories
#
# To accept an advisory, add it to `ignore` with the reason, e.g.
#   { id = "RUSTSEC-0000-0000", reason = "only reachable from X, which we do not call" },

[graph]
# Every target the app ships for, so Linux- and Windows-only dependencies are
# checked from any host.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Unmaintained crates fail only when we depend on them directly; deep in the
# Tauri/GTK tree they are upstream's call and would keep the job red forever.
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa has no fixed release. It decrypts the two values of one sign-in with a key made for that sign-in, so there is no stream of decryptions to time" },
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not vulnerable. 142 files use it; the move is planned in #452" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, not vulnerable. It reads fonts the person picks; the move to skrifa is #451" },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.37 comes only through librqbit-upnp, which has no release on a fixed version. It parses UPnP replies from routers on the local network, not files or pages from outside" },
  { id = "RUSTSEC-2026-0195", reason = "same quick-xml 0.37 under librqbit-upnp as RUSTSEC-2026-0194; the core uses quick-xml 0.42" },
]
