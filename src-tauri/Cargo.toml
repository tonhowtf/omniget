[workspace]
members = [".", "omniget-core", "omniget-cli", "omniget-atlas", "omniworld-server", "omniget-phonechat"]
resolver = "2"

[package]
name = "omniget"
version = "1.0.1"
description = "Desktop app with a local MCP server that gives coding agents a toolbox for downloads, media, files, chats and system cleanup, plus a downloader for YouTube, Instagram, TikTok, X, torrents, the sites yt-dlp supports and the online courses you bought, and a Canvas for agent terminals"
authors = ["tonhowtf"]
license = "GPL-3.0"
repository = "https://github.com/tonhowtf/omniget"
homepage = "https://getomniget.com"
keywords = ["mcp", "ai-agents", "downloader", "yt-dlp", "system-cleaner"]
categories = ["multimedia", "development-tools", "gui"]
edition = "2021"

[lib]
name = "omniget_lib"
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "omniget"
path = "src/main.rs"
test = false

[package.metadata.cargo-machete]
ignored = ["tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "http2", "gzip", "brotli", "deflate", "rustls-tls", "socks"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
roxmltree = "0.21.1"
aes = "0.8"
cbc = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower-http = { version = "0.6", features = ["cors"] }
constant_time_eq = "0.4"
socket2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sanitize-filename = "0.6"
unicode-normalization = "0.1"
tokio-util = { version = "0.7", features = ["rt", "io"] }
url = "2"
urlencoding = "2"
rand = "0.10.0"
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint"] }
base64 = "0.22.1"
tempfile = "=3.27.0"
sha2 = "0.10"
ed25519-dalek = "2"
data-encoding = "2"
hex = "0.4"
hmac = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rsa = "0.9"
flate2 = "1"
tar = "0.4"
portable-pty = "0.9"
omniget-core = { path = "omniget-core" }
sysinfo = "0.39.6"
omniget-phonechat = { path = "omniget-phonechat" }
which = "7"
walkdir = "2"
bytes = "1"
h2 = "0.4"
http = "1"
librqbit = "8.1.1"
keepawake = "0.5"
discord-rich-presence = "0.2"
once_cell = "1"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
native-tls = "0.2.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
fs4 = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-native-tls", "builder", "hostname"] }

[dev-dependencies]
libunftp = { version = "0.24", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
keyring = { version = "3", features = ["windows-native"] }
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging"] }

# WHY: reads WKWebView's cookie store: document.cookie cannot see HttpOnly cookies (#287).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSHTTPCookie", "NSArray", "NSString"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore", "WKSnapshotConfiguration"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "tokio"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"

[profile.dev]
debug = 0
codegen-units = 256
incremental = true

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
grammers-session = { path = "vendor/grammers-session-patched" }
grammers-mtsender = { path = "vendor/grammers-mtsender-patched" }
pdfcraft-organize = { path = "vendor/pdfcraft/organize" }
pdfcraft-cos = { path = "vendor/pdfcraft/cos" }
pdfcraft-filters = { path = "vendor/pdfcraft/filters" }
photocraft-psd = { path = "vendor/photocraft-psd" }
