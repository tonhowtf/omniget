[workspace]
members = [".", "omniget-core", "omniget-plugin-sdk", "omniget-cli", "omnidisc-proto", "omnidisc-media", "omnidisc-mls"]
resolver = "2"

[package]
name = "omniget"
version = "0.9.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "omniget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["linux-capture"]
# Off for the x86_64 Linux release, whose runner has PipeWire headers older than
# the capture backend can compile against. Everything else in the client is
# unaffected, and `MediaCapabilities` reports the loss rather than hiding it.
linux-capture = ["omnidisc-media/linux-capture"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "http2", "gzip", "brotli", "deflate", "rustls-tls", "socks"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
m3u8-rs = "6"
aes = "0.8"
cbc = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tower-http = { version = "0.6", features = ["cors"] }
constant_time_eq = "0.4"
socket2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sanitize-filename = "0.6"
unicode-normalization = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
urlencoding = "2"
rand = "0.10.0"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22.1"
filetime = "0.2.27"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
sha2 = "0.10"
md-5 = "0.10"
murmur3 = "0.5"
hex = "0.4"
thiserror = "1"
hmac = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
open = "5"
omniget-core = { path = "omniget-core", features = ["desktop"] }
omniget-plugin-sdk = { path = "omniget-plugin-sdk" }
omnidisc-proto = { path = "omnidisc-proto" }
omnidisc-media = { path = "omnidisc-media", default-features = false, features = ["rnnoise"] }
omnidisc-mls = { path = "omnidisc-mls" }
libloading = "0.8"
which = "7"
librqbit = "8.1.1"
keepawake = "0.5"
discord-rich-presence = "0.2"
once_cell = "1"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
native-tls = "0.2.18"
fs4 = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging"] }

# Reading WKWebView's cookie store directly — document.cookie cannot see
# HttpOnly cookies, which is the whole point of the auth webview (#287).
# Versions track what wry already resolves, so this adds no new build cost.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSHTTPCookie", "NSArray", "NSString"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore"] }
block2 = "0.6"

# Same idea for WebKitGTK (#288). Pinned to the exact version wry resolves so
# it is the same compiled crate, not a second copy.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"

[profile.dev]
debug = 0
codegen-units = 256
incremental = true

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
