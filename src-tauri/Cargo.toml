[workspace]
members = [".", "omniget-core", "omniget-cli", "omniget-world-tools", "omniget-world", "omniworld-server", "omniget-citygen", "omniget-avatar", "omniget-codegeo", "omniget-asset3d"]
resolver = "2"

[package]
name = "omniget"
version = "1.0.0"
description = "Desktop downloader for YouTube, Instagram, TikTok, X, torrents and the sites yt-dlp supports, with an MCP server for coding agents and a window to run AI agents (Claude Code, Codex, Gemini CLI, Ollama), meeting notes (record, transcribe, summarize, import Teams recordings), plus a system cleaner and uninstaller (washmybelly)"
authors = ["tonhowtf"]
license = "GPL-3.0"
repository = "https://github.com/tonhowtf/omniget"
homepage = "https://getomniget.com"
keywords = ["downloader", "yt-dlp", "ai-agents", "mcp", "system-cleaner"]
categories = ["multimedia", "development-tools", "gui"]
edition = "2021"

# Desktop only, so the lib is a plain rlib. The Tauri template's "staticlib"
# and "cdylib" exist for iOS/Android; on desktop they wrote a ~650 MB archive
# and linked an unused dylib on every build, and made the app crate wait for
# omniget-core's full codegen instead of starting on its metadata.
# The lib has no runnable doctests (every code block is `text` or `ignore`),
# so `cargo test` skips the rustdoc pass over the whole crate.
[lib]
name = "omniget_lib"
crate-type = ["rlib"]
doctest = false

# main.rs has no tests. Without this, `cargo test` also builds a non-test copy
# of the whole lib just to link an empty test harness for the binary.
[[bin]]
name = "omniget"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zip = { version = "4.6", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream", "http2", "gzip", "brotli", "deflate", "rustls-tls", "socks"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
aes = "0.8"
cbc = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower-http = { version = "0.6", features = ["cors"] }
constant_time_eq = "0.4"
socket2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
sanitize-filename = "0.6"
unicode-normalization = "0.1"
tokio-util = { version = "0.7", features = ["rt", "io"] }
url = "2"
urlencoding = "2"
rand = "0.10.0"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22.1"
# Atomic settings writes (same pin as omniget-core).
tempfile = "=3.25.0"
sha2 = "0.10"
ed25519-dalek = "2"
data-encoding = "2"
hex = "0.4"
hmac = "0.12"
# QR de pareamento do acesso remoto da Central.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Terminal embutido da Central (PTY multiplataforma do wezterm).
portable-pty = "0.9"
omniget-core = { path = "omniget-core" }
omniget-citygen = { path = "omniget-citygen" }
omniget-avatar = { path = "omniget-avatar" }
omniget-codegeo = { path = "omniget-codegeo" }
omniget-asset3d = { path = "omniget-asset3d" }
which = "7"
# /music: walking the library folders
walkdir = "2"
librqbit = "8.1.1"
keepawake = "0.5"
discord-rich-presence = "0.2"
once_cell = "1"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
native-tls = "0.2.18"
# /video cast: CASTV2 over TLS to the Chromecast (same rustls/ring the lock already has).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
fs4 = "1"
# /meetings: local capture (mic + system audio loopback) into WAV tracks.
cpal = "0.18"
hound = "3.5"
# /read: send-to-Kindle / e-mail delivery of books.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-native-tls", "builder", "hostname"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging"] }

# Reading WKWebView's cookie store directly — document.cookie cannot see
# HttpOnly cookies, which is the whole point of the auth webview (#287).
# Versions track what wry already resolves, so this adds no new build cost.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSHTTPCookie", "NSArray", "NSString"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore", "WKSnapshotConfiguration"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep"] }

# Same idea for WebKitGTK (#288). Pinned to the exact version wry resolves so
# it is the same compiled crate, not a second copy.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# Secret Service over zbus (pure Rust, no libdbus at build time). Plan §9.4.
# Falls back to the encrypted file store on PlatformFailure/NoStorageAccess.
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "tokio"] }
# City 3D live expression, native camera path (commands/city3d/live.rs): V4L2
# capture without mozjpeg (MJPEG frames are decoded by `image`), and the same
# `ort` as omniget-core so the pose model runs on the managed ONNX Runtime.
nokhwa = { version = "0.10.11", default-features = false, features = ["input-v4l"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-27"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
# Paused clock for the notification timing tests (`llm_attention`): the
# delay, the cooldown and the "answered in under 5 s" rule are measured in
# virtual time instead of sleeping. Test builds only.
tokio = { version = "1", features = ["full", "test-util"] }

[profile.dev]
debug = 0
codegen-units = 256
incremental = true

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# grammers 0.8 with two local fixes (from the Telegram plugin): the
# InvocationError `From` recursion that overflowed the stack on network
# errors (omniget#289) and the channel id range. Both are fixed upstream in
# 0.10; drop these when the Telegram client moves there.
[patch.crates-io]
grammers-session = { path = "vendor/grammers-session-patched" }
grammers-mtsender = { path = "vendor/grammers-mtsender-patched" }
