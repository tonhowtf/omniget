name: skin-tokens.cpp

# Compila o skin-tokens.cpp (auto-rig da cidade 3D, Apache-2.0) num commit
# fixado e publica o `skintokens-cli` com as bibliotecas do ggml ao lado numa
# release propria, `skintokens-<commit curto>`. O upstream nao tem binario
# oficial; o app baixa este pacote pelo `city3d_autorig_install_cli`.
#
# O commit fica em `scripts/skintokens/build.sh`, o mesmo script que valida o
# pacote no Mac. Depois de rodar: copie os sha256 do corpo da release para
# `CLI_RELEASE` em `src-tauri/omniget-asset3d/src/providers/skintokens.rs`.
#
# So roda por `workflow_dispatch`; nao faz parte da release do app.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar a release (off = so compilar e guardar os artefatos)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: skintokens
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-14
          # 24.04: o C++23 do upstream pede GCC 13. O binario pede glibc 2.39.
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Commit fixado
        id: pin
        run: |
          commit="$(bash scripts/skintokens/build.sh --commit)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout do skin-tokens.cpp
        uses: actions/checkout@v4
        with:
          repository: localai-org/skin-tokens.cpp
          ref: ${{ steps.pin.outputs.commit }}
          path: skin-tokens.cpp
          submodules: recursive

      - name: Dependencias (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev glslc spirv-headers

      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: false
          cache: true

      - name: Compilar e empacotar
        run: bash scripts/skintokens/build.sh "${{ matrix.platform }}" dist skin-tokens.cpp

      - uses: actions/upload-artifact@v4
        with:
          name: skintokens-cli-${{ matrix.platform }}
          path: |
            dist/skintokens-cli-${{ matrix.platform }}.tar.gz
            dist/skintokens-cli-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(bash scripts/skintokens/build.sh --commit)"
          tag="skintokens-${commit:0:7}"
          cd dist
          cat *.sha256 > SHA256SUMS
          {
            echo "skintokens-cli do [skin-tokens.cpp](https://github.com/localai-org/skin-tokens.cpp/tree/$commit) (Apache-2.0) com as bibliotecas do ggml (MIT) ao lado."
            echo "Pacote para o auto-rig da cidade 3D do OmniGet; nao e uma release do app."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" *.tar.gz *.sha256 SHA256SUMS --clobber
          else
            gh release create "$tag" *.tar.gz *.sha256 SHA256SUMS \
              --title "skin-tokens.cpp ${commit:0:7}" \
              --notes-file notes.md \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
