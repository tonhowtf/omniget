name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (vX.Y.Z)'
        required: true
      ref:
        description: 'Branch or commit to build instead of the tag (for a trial run); the tag still names the output'
        required: false
        default: ''
      only:
        description: 'Comma list of targets (mac-arm64,mac-x64,linux-x64,windows-x64); empty builds all'
        required: false
        default: ''
      assemble:
        description: 'Draft the release from this run'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 8
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          ALL='[{"name":"mac-arm64","os":"macos-latest","target":"aarch64-apple-darwin"},{"name":"mac-x64","os":"macos-latest","target":"x86_64-apple-darwin"},{"name":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"name":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc"}]'
          M=$(jq -c --arg only "$ONLY" '{include: (if $only == "" then . else map(select(.name as $n | ($only | split(",") | map(gsub(" "; "")) | index($n)))) end)}' <<< "$ALL")
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "$M"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    env:
      SIGNPATH: ${{ matrix.name == 'windows-x64' && vars.SIGNPATH_POLICY != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.inputs.ref || env.TAG }}
          fetch-depth: 0

      - name: Disk and swap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo swapoff -a
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Pagefile (Windows)
        if: runner.os == 'Windows'
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708 # v1.4
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: 'D:'

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpipewire-0.3-dev clang libclang-dev patchelf xdg-utils rpm

      - name: zip (Windows CLI archive)
        if: runner.os == 'Windows'
        run: choco install zip -y --no-progress

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri'
          key: release-${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign and collect
        if: env.SIGNPATH != 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NO_STRIP: ${{ runner.os == 'Linux' && '1' || '' }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/release-local.mjs --target ${{ matrix.target }} --cli --out dist-release

      - name: "Windows 1/3, compile without bundling"
        if: env.SIGNPATH == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/release-local.mjs --target ${{ matrix.target }} --cli --out dist-release --stage compile

      - name: Upload the unsigned binaries
        if: env.SIGNPATH == 'true'
        id: unsigned-binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-binaries
          path: signpath/binaries/*
          if-no-files-found: error
          retention-days: 5

      - name: SignPath signs the binaries (waits for the approval)
        if: env.SIGNPATH == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: fe38e5c8-df53-44c7-a5ad-9c6c86d8bbb7
          project-slug: omniget
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signpath/binaries-signed

      - name: "Windows 2/3, installers from the signed executables"
        if: env.SIGNPATH == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/release-local.mjs --target ${{ matrix.target }} --cli --out dist-release --stage bundle

      - name: Upload the unsigned installers
        if: env.SIGNPATH == 'true'
        id: unsigned-installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signpath-installers
          path: signpath/installers/*
          if-no-files-found: error
          retention-days: 5

      - name: SignPath signs the installers (waits for the approval)
        if: env.SIGNPATH == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: fe38e5c8-df53-44c7-a5ad-9c6c86d8bbb7
          project-slug: omniget
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signpath/installers-signed

      - name: "Windows 3/3, updater signature and release folder"
        if: env.SIGNPATH == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/release-local.mjs --target ${{ matrix.target }} --cli --out dist-release --stage collect

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: |
            dist-release/${{ env.TAG }}/*
            !dist-release/${{ env.TAG }}/SHA256SUMS
            !dist-release/${{ env.TAG }}/latest.json
          if-no-files-found: error
          retention-days: 30

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.inputs.ref || env.TAG }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*

      - name: Package Chrome extension
        run: |
          VERSION="${TAG#v}"
          mkdir -p out
          node browser-extension/chrome/scripts/package.mjs --version "$VERSION" --output "out/omniget-chrome-extension-v${VERSION}.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extension
          path: out/*
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: [build, extension]
    if: github.event_name == 'push' || github.event.inputs.assemble == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.inputs.ref || env.TAG }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: SHA256SUMS and latest.json
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES="$RUNNER_TEMP/notes.txt"
          node -e '
            const xml = require("fs").readFileSync("flatpak/wtf.tonho.omniget.metainfo.xml", "utf8");
            const start = xml.indexOf(`<release version="${process.argv[1]}"`);
            const entry = start < 0 ? "" : xml.slice(start, xml.indexOf("</release>", start));
            const text = [...entry.matchAll(/<p>([\s\S]*?)<\/p>/g)].map((m) => m[1].trim()).join("\n\n");
            const ent = { lt: "<", gt: ">", quot: "\"", apos: "\u0027", amp: "&" };
            process.stdout.write(text.replace(/&(lt|gt|quot|apos|amp);/g, (_, k) => ent[k]));
          ' "$VERSION" > "$NOTES"
          ARGS=(out --base https://getomniget.com/dl)
          [ -s "$NOTES" ] && ARGS+=(--notes "$NOTES")
          node scripts/make-latest-json.mjs "${ARGS[@]}"
          (cd out && sha256sum $(ls | grep -v -e '\.sig$' -e '^latest\.json$' -e '^SHA256SUMS$' | sort) > SHA256SUMS)
          ls -la out
          jq '.platforms | keys' out/latest.json

      - name: Draft release with every file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --draft --title "OmniGet $TAG" --notes "Build $TAG. Publish with pnpm fetch:release and pnpm mirror on the site repository."
          fi
