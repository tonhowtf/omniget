name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'ubuntu-24.04-arm'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v5

      - name: Install frontend dependencies
        run: pnpm install

      # Pinned via rust-toolchain.toml: the plugin ABI depends on the exact
      # rustc version, so this must match what the plugin repos build with.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LDAI_UPDATE_INFORMATION: ${{ contains(matrix.platform, 'ubuntu') && 'gh-releases-zsync|tonhowtf|omniget|latest|*AppImage.zsync' || '' }}
          NODE_OPTIONS: --max-old-space-size=6144
        with:
          tagName: v__VERSION__
          releaseName: 'OmniGet v__VERSION__'
          releaseBody: |
            ## Downloads

            **Windows**: `.exe` installer or portable.
            **macOS**: `.dmg` (Apple Silicon `aarch64` or Intel `x86_64`).
            **Linux**: `.AppImage` (universal) or `.deb` (Debian/Ubuntu).

            ---

            ### Debian/Ubuntu users — AppImage compatibility

            **Debian 12+ ships without FUSE 2 by default**, which AppImage requires.
            If `./omniget.AppImage` fails with a libfuse error, run:

            ```bash
            sudo apt install libfuse2
            ```

            …or use `./omniget.AppImage --appimage-extract-and-run`.

            **Easier alternative**: download the `.deb` instead — works out of the
            box on Debian 12+ and Ubuntu 22.04+.

            ---

            ### macOS users — "OmniGet is damaged and can't be opened"

            The app is not notarized with Apple yet, so Gatekeeper quarantines it.
            After moving the app to `/Applications`, run:

            ```bash
            xattr -cr /Applications/omniget.app
            ```

            Then open it normally. If it still refuses, allow it under
            **System Settings → Privacy & Security**.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Generate and upload AppImage zsync files
        if: contains(matrix.platform, 'ubuntu')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get install -y zsync
          TAG="${GITHUB_REF#refs/tags/}"
          for appimage in src-tauri/target/release/bundle/appimage/*.AppImage; do
            if [ -f "$appimage" ]; then
              zsyncmake "$appimage" -o "${appimage}.zsync" -u "$(basename "$appimage")"
              gh release upload "$TAG" "${appimage}.zsync" --repo "${{ github.repository }}" --clobber
            fi
          done

      - name: Upload Windows portable binary
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "${{ github.ref_name }}"
          $VERSION = $TAG -replace '^v', ''
          $EXE = "src-tauri/target/release/omniget.exe"
          $DEST = "omniget_${VERSION}_x64-portable.exe"
          if (Test-Path $EXE) {
            Copy-Item $EXE $DEST
            gh release upload $TAG $DEST --repo ${{ github.repository }} --clobber
          }
        shell: pwsh

  build-cli:
    # O omniget-cli existe no workspace desde sempre mas nunca saiu numa
    # release, entao a unica forma de usar era compilar da fonte (issue #202).
    #
    # `needs: publish-tauri` porque o upload precisa da release existir — quem a
    # cria e o publish-tauri. A *compilacao* e independente (o CLI nao precisa de
    # webkit/gtk: a arvore nao tem openssl-sys), e foi essa independencia que me
    # fez omitir o needs na #221. O resultado foi `release not found` na v0.8.0,
    # com o binario compilado e jogado fora.
    needs: publish-tauri
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # `@master` com a versao fixada, e nao `@stable`: o rust-toolchain.toml da
      # raiz forca 1.97.0, entao instalar o alvo no `stable` deixa a build usando
      # um toolchain que nao tem o alvo — `can't find crate for core` na primeira
      # release. O publish-tauri ja fazia assim; este job nao seguiu o padrao.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build CLI
        working-directory: src-tauri
        run: cargo build -p omniget-cli --release --target ${{ matrix.target }}

      - name: Package and upload (unix)
        if: matrix.os != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          BIN="src-tauri/target/${{ matrix.target }}/release/omniget-cli"
          # Falha alto se o binario nao existe: subir uma release sem o
          # artefato e pior do que o job ficar vermelho.
          test -x "$BIN"
          "$BIN" --version
          OUT="omniget-cli-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$OUT" -C "$(dirname "$BIN")" omniget-cli
          gh release upload "$TAG" "$OUT" --repo "${{ github.repository }}" --clobber

      - name: Package and upload (windows)
        if: matrix.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $TAG = "${{ github.ref_name }}"
          $VERSION = $TAG -replace '^v', ''
          $BIN = "src-tauri/target/${{ matrix.target }}/release/omniget-cli.exe"
          if (-not (Test-Path $BIN)) { throw "binario nao encontrado: $BIN" }
          & $BIN --version
          $OUT = "omniget-cli-${VERSION}-${{ matrix.target }}.zip"
          Compress-Archive -Path $BIN -DestinationPath $OUT -Force
          gh release upload $TAG $OUT --repo ${{ github.repository }} --clobber
        shell: pwsh

  package-chrome-extension:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Package Chrome extension
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          OUTPUT="omniget-chrome-extension-v${VERSION}.zip"
          node browser-extension/chrome/scripts/package.mjs --version "$VERSION" --output "$OUTPUT"
          gh release upload "$TAG" "$OUTPUT" --repo "${{ github.repository }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-updater-json:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          REPO="${GITHUB_REPOSITORY}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          JSON=$(jq -n \
            --arg v "$VERSION" \
            --arg d "$PUB_DATE" \
            '{version: $v, notes: "", pub_date: $d, platforms: {}}')

          declare -A PLATFORM_MAP=(
            ["aarch64.app.tar.gz.sig"]="darwin-aarch64"
            ["x64.app.tar.gz.sig"]="darwin-x86_64"
            ["amd64.AppImage.sig"]="linux-x86_64"
            ["aarch64.AppImage.sig"]="linux-aarch64"
            ["x64-setup.exe.sig"]="windows-x86_64"
          )

          ASSETS=""
          for attempt in $(seq 1 10); do
            ASSETS=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' || true)
            MISSING=0
            for SUFFIX in "${!PLATFORM_MAP[@]}"; do
              if ! echo "$ASSETS" | grep -q "${SUFFIX}$"; then
                MISSING=$((MISSING + 1))
              fi
            done
            if [ "$MISSING" -eq 0 ]; then
              echo "All expected .sig assets are visible (attempt $attempt)."
              break
            fi
            echo "Attempt $attempt: $MISSING .sig asset(s) not yet visible, retrying in 30s..."
            sleep 30
          done

          TMPDIR=$(mktemp -d)

          for SUFFIX in "${!PLATFORM_MAP[@]}"; do
            PLATFORM="${PLATFORM_MAP[$SUFFIX]}"
            SIG_FILE=$(echo "$ASSETS" | grep "${SUFFIX}$" || true)

            if [ -n "$SIG_FILE" ]; then
              BUNDLE="${SIG_FILE%.sig}"
              DOWNLOADED=0
              for dl_attempt in $(seq 1 10); do
                if gh release download "$TAG" --repo "$REPO" --pattern "$SIG_FILE" --dir "$TMPDIR" --clobber; then
                  DOWNLOADED=1
                  break
                fi
                echo "Download attempt $dl_attempt for $SIG_FILE failed, retrying in 30s..."
                sleep 30
              done
              if [ "$DOWNLOADED" -ne 1 ]; then
                echo "Failed to download $SIG_FILE after 10 attempts" >&2
                exit 1
              fi
              SIG_CONTENT=$(cat "$TMPDIR/$SIG_FILE")
              URL="https://github.com/${REPO}/releases/download/${TAG}/${BUNDLE}"

              JSON=$(echo "$JSON" | jq \
                --arg p "$PLATFORM" \
                --arg sig "$SIG_CONTENT" \
                --arg url "$URL" \
                '.platforms[$p] = {signature: $sig, url: $url}')
            fi
          done

          echo "$JSON" > latest.json
          echo "Generated latest.json:"
          cat latest.json

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

          rm -rf "$TMPDIR"
