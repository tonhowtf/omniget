name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Format
        if: matrix.platform == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets

      # Portao de verdade sem pintar o dia um de vermelho: compara com o
      # baseline commitado e reprova so warning novo. Roda nas tres plataformas,
      # cada uma contra o seu proprio arquivo — `#[cfg(target_os)]` faz o clippy
      # enxergar codigo diferente em cada SO, e um baseline unico deixaria todo
      # codigo condicional fora do portao. Plataforma sem baseline ainda nao
      # gerado nao reprova: o passo imprime o conteudo a commitar.
      - name: Clippy baseline (no new warnings)
        run: node scripts/clippy-baseline.mjs --check

      - name: Test
        working-directory: src-tauri
        run: cargo test --workspace

  rust-debian:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate' }}
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget git build-essential pkg-config \
            libssl-dev file unzip xz-utils

      - uses: actions/checkout@v4

      - name: Install Debian system dependencies
        run: |
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'
          key: debian

      - name: Cargo check (Debian compat)
        working-directory: src-tauri
        run: cargo check --workspace --all-targets

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Este e o portao que faltava: `pnpm check` sai com 1 em erro de tipo, que
      # foi exatamente o que passou despercebido na PR #197.
      - name: svelte-check
        run: pnpm check

      - name: Unit tests (vitest)
        run: pnpm test

      # `--strict` reprova quando algum locale esta fora de sincronia com en.json.
      - name: Locales in sync with en.json
        run: pnpm check:i18n

      - name: Generated i18n keys are committed
        run: |
          pnpm generate:i18n-keys
          git diff --exit-code -- src/lib/i18n/keys.ts

  # B55. O CI provava que compila nas quatro plataformas e nunca abriu o app
  # uma vez — foi por essa fresta que a #209 entrou em `main`. Este job sobe o
  # binario de verdade e exige a linha de janela criada.
  #
  # Criterio de aceite do item: reverter o B49 tem que deixar este job vermelho.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build app
        working-directory: src-tauri
        run: cargo build

      - name: Smoke (modo padrao)
        shell: bash
        run: |
          BIN=src-tauri/target/debug/omniget
          [ "${{ matrix.platform }}" = "windows-latest" ] && BIN="$BIN.exe"
          if [ "${{ matrix.platform }}" = "ubuntu-latest" ]; then
            xvfb-run -a node scripts/smoke-test.mjs "$BIN"
          else
            node scripts/smoke-test.mjs "$BIN"
          fi

      # A #209 e especificamente sobre Windows: `portable.txt` ao lado do exe
      # nao pode deixar nada no perfil do usuario, e o WebView2 tem que apontar
      # para <app>/data/webview. Esse caminho esta atras de cfg(windows).
      - name: Smoke (modo portatil)
        shell: bash
        run: |
          BIN=src-tauri/target/debug/omniget
          [ "${{ matrix.platform }}" = "windows-latest" ] && BIN="$BIN.exe"
          if [ "${{ matrix.platform }}" = "ubuntu-latest" ]; then
            xvfb-run -a node scripts/smoke-test.mjs "$BIN" --portable
          else
            node scripts/smoke-test.mjs "$BIN" --portable
          fi

  metainfo:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.login != 'weblate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install appstreamcli
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream

      - name: Validate flatpak metainfo
        run: appstreamcli validate flatpak/wtf.tonho.omniget.metainfo.xml
