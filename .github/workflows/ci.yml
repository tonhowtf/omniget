name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Also run on Windows and macOS'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.pick.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Pick the platforms
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          ALL: ${{ inputs.all_platforms }}
          BEFORE: ${{ github.event.before }}
        run: |
          all='["ubuntu-22.04","windows-latest","macos-latest"]'
          linux='["ubuntu-22.04"]'
          pattern='(^|/)Cargo\.(toml|lock)$|^package\.json$|^pnpm-lock\.yaml$|^rust-toolchain\.toml$|^src-tauri/(tauri[^/]*\.conf\.json|build\.rs|Entitlements\.plist|Info\.plist|capabilities/)|^\.github/workflows/(ci|release)\.yml$'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$ALL" = "true" ] && pick="$all" || pick="$linux"
          else
            base="HEAD^1"
            known=true
            if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ]; then
              if git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
                base="$BEFORE"
              else
                known=false
              fi
            fi
            if [ "$known" = "false" ] || ! changed="$(git diff --name-only "$base" HEAD)"; then
              echo "could not list the changed files, running every platform"
              pick="$all"
            elif echo "$changed" | grep -Eq "$pattern"; then
              echo "build or dependency files changed:"
              echo "$changed" | grep -E "$pattern"
              pick="$all"
            else
              pick="$linux"
            fi
          fi
          echo "platforms=$pick" >> "$GITHUB_OUTPUT"
          echo "platforms: $pick"

  rust:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Disk and swap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo swapoff -a
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h / /mnt

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpipewire-0.3-dev clang libclang-dev

      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: No unused Rust dependencies (cargo-machete)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo install cargo-machete --locked --version 0.9.2
          cargo machete --with-metadata --skip-target-dir

      - name: Format
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets

      - name: Clippy baseline (no new warnings)
        run: node scripts/clippy-baseline.mjs --check

      - name: Test
        working-directory: src-tauri
        timeout-minutes: 90
        run: cargo test --workspace --no-fail-fast --jobs 2 -- --test-threads 2

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: IPC contract (invoke and listen targets)
        run: pnpm check:ipc

      - name: Tauri crates and npm packages on the same version
        run: pnpm check:tauri-versions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Locales in sync with en.json
        run: pnpm check:i18n

      - name: No unused files or dependencies (knip)
        run: pnpm check:dead

      - name: Browser extension tests
        run: pnpm test:extension

      - name: Claude Code plugin tests
        run: pnpm test:plugin

  smoke:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Disk and swap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo swapoff -a
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h / /mnt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpipewire-0.3-dev clang libclang-dev xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build

      - name: Build app
        working-directory: src-tauri
        run: cargo build

      - name: Smoke (default and portable)
        shell: bash
        run: |
          BIN=src-tauri/target/debug/omniget
          [ "$RUNNER_OS" = "Windows" ] && BIN="$BIN.exe"
          RUN=""
          [ "$RUNNER_OS" = "Linux" ] && RUN="xvfb-run -a"
          $RUN node scripts/smoke-test.mjs "$BIN"
          $RUN node scripts/smoke-test.mjs "$BIN" --portable

  ci-ok:
    needs: [plan, rust, frontend, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result != "success")' > /dev/null; then
            echo "::error::at least one CI job did not pass"
            exit 1
          fi
