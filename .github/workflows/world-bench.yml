name: World bench

# Bench de pior caso do mundo (plano §1.4). Fica fora do `ci.yml` de proposito:
# e um job caro (build debug + dois cenarios de 40 s cada) que so interessa a
# quem mexeu no mundo, e o `ci.yml` e arquivo compartilhado.
#
# Runner hospedado do GitHub nao tem GPU: `ubuntu-22.04` + `xvfb` + llvmpipe ja
# e o tier 0 do plano, de graca e reproduzivel. O que o job responde:
#   I-12  o WebGL2 cria mesmo sob xvfb + llvmpipe? (campo `webgl2` do JSON)
#   I-5   quanto custa um `tauri::ipc::Channel` binario? (campo `ipc`)
#   §1.2  frame, primeiro frame e RSS extra do tier 0.
#
# O portao e `scripts/world-bench.mjs`: qualquer metrica mais de 10% pior que
# `docs/bench/world-baseline.json` reprova. O baseline e atualizado **so pelo
# orquestrador** ao fechar a fase — nenhum job escreve nele.

on:
  workflow_dispatch:
    inputs:
      compare:
        description: "Comparar com o baseline (off = so medir)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "src/lib/world/**"
      - "src/routes/world/**"
      - "src-tauri/src/world_bench.rs"
      - "src-tauri/src/commands/world_bench.rs"
      - "static/world/**"
      - "scripts/world-bench.mjs"
      - "docs/bench/world-baseline.json"
      - ".github/workflows/world-bench.yml"

concurrency:
  group: world-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    # `ubuntu-22.04` e nao `ubuntu-latest`: o piso do plano e WebKitGTK 2.50.4,
    # que e o que o 22.04 carrega. O 24.04 traz 2.52.6 e mediria outra coisa.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        scenario: [llvmpipe, nocompositing]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      # Mesmas deps do job `smoke` do ci.yml, mais o Mesa por software: sem
      # `libgl1-mesa-dri` o `GALLIUM_DRIVER=llvmpipe` nao tem driver para
      # carregar e o WebGL nao cria por falta de pacote, o que seria um falso
      # negativo para a I-12.
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libpipewire-0.3-dev clang libclang-dev xvfb \
            libgl1-mesa-dri libegl-mesa0 libglx-mesa0 mesa-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O `build/` nao e so artefato: um binario debug do Tauri aponta para o
      # `devUrl` (http://localhost:1420), e nao para o `frontendDist`. O
      # `world-bench.mjs` serve esta pasta naquela porta antes de subir o app —
      # sem isso a janela abre numa pagina que nao existe e o bench so consegue
      # estourar o timeout. O job `smoke` nao percebe porque so exige a janela.
      - name: Build frontend
        run: pnpm build

      - name: Build app
        working-directory: src-tauri
        run: cargo build

      # Versoes que entram no JSON. O app nao tem como perguntar isso a si
      # mesmo sem uma dependencia nova, entao o workflow mede e passa por
      # ambiente (ver ENV_WEBKITGTK/ENV_MESA em src-tauri/src/world_bench.rs).
      - name: Versoes do webview e do Mesa
        id: versions
        run: |
          WK=$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0 2>/dev/null || echo desconhecido)
          MESA=$(LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe xvfb-run -a glxinfo -B 2>/dev/null \
                 | grep -i 'OpenGL renderer string' | cut -d: -f2- | xargs || echo desconhecido)
          echo "webkitgtk=$WK" >> "$GITHUB_OUTPUT"
          echo "mesa=$MESA" >> "$GITHUB_OUTPUT"
          echo "WebKitGTK: $WK"
          echo "Mesa: $MESA"

      # I-12, explicitamente: o driver escolhido aparece no log do EGL. Este
      # passo nao reprova nada; existe para que "o WebGL2 criou" seja uma
      # afirmacao com evidencia e nao uma suposicao.
      - name: EGL debug (I-12)
        continue-on-error: true
        run: |
          EGL_LOG_LEVEL=debug LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe LP_NUM_THREADS=2 \
            xvfb-run -a glxinfo -B 2>&1 | grep -i -E 'llvmpipe|iris|radeonsi|swrast' || \
            echo "nenhuma linha de driver no log do EGL"

      - name: Bench (${{ matrix.scenario }})
        env:
          OMNIGET_WORLD_BENCH_WEBKITGTK: ${{ steps.versions.outputs.webkitgtk }}
          OMNIGET_WORLD_BENCH_MESA: ${{ steps.versions.outputs.mesa }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.compare }}" != "true" ]; then
            ARGS="--no-compare"
          fi
          xvfb-run -a node scripts/world-bench.mjs \
            --scenario ${{ matrix.scenario }} \
            --out world-bench-${{ matrix.scenario }}.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            $ARGS

      # `always()`: o JSON de uma rodada que reprovou e justamente o que se quer
      # olhar depois.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-bench-${{ matrix.scenario }}
          path: world-bench-${{ matrix.scenario }}.json
          if-no-files-found: warn
