app-id: wtf.tonho.omniget
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

command: omniget

finish-args:
  - --share=ipc
  # Downloading media from the web is the core feature; the local MCP server
  # that coding agents connect to also listens on 127.0.0.1 only.
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  # Account cookies and API keys are kept in the Secret Service keyring.
  - --talk-name=org.freedesktop.secrets
  # Audio and video preview of downloaded media.
  - --socket=pulseaudio
  - --device=dri
  # Default output folders for downloads, videos and music. Any other folder
  # is chosen through the FileChooser portal.
  - --filesystem=xdg-download
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  # Notification when a download finishes.
  - --talk-name=org.freedesktop.Notifications
  # Tray icon: the app keeps running in the background while downloads finish.
  - --talk-name=org.kde.StatusNotifierWatcher
  # "Show in folder" for a finished download opens the file manager with the
  # file selected; the OpenURI portal can only open the folder.
  - --talk-name=org.freedesktop.FileManager1

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/omniget/cargo
    npm_config_nodedir: /usr/lib/sdk/node22

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.la
  - /share/man

modules:
  - name: intltool
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_BINDINGS_MONO=NO
      - -DENABLE_BINDINGS_VALA=NO
      - -DENABLE_GTKDOC=NO
    modules:
      - name: libdbusmenu
        buildsystem: autotools
        build-options:
          cflags: -Wno-error
        config-opts:
          - --with-gtk=3
          - --disable-dumper
          - --disable-static
          - --disable-tests
          - --disable-gtk-doc
          - --enable-introspection=no
          - --disable-vala
        sources:
          - type: archive
            url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
            sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
          - type: patch
            path: 0001-Fix-HAVE_VALGRIND-AM_CONDITIONAL.patch
          - type: shell
            commands:
              - autoreconf -fi

      - name: ayatana-ido
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_INSTALL_LIBDIR=lib
          - -DENABLE_INTROSPECTION=OFF
        sources:
          - type: git
            url: https://github.com/AyatanaIndicators/ayatana-ido.git
            tag: '0.10.4'
            commit: f968079b09e2310fefc3fc307359025f1c74b3eb
          - type: patch
            path: 0001-Make-introspection-configurable.patch

      - name: libayatana-indicator
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_INSTALL_LIBDIR=lib
        sources:
          - type: git
            url: https://github.com/AyatanaIndicators/libayatana-indicator.git
            tag: '0.9.4'
            commit: 611bb384b73fa6311777ba4c41381a06f5b99dad

    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-appindicator.git
        tag: '0.5.94'
        commit: 31e8bb083b307e1cc96af4874a94707727bd1e79

  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --disable-doc
      - --disable-debug
      - --enable-gpl
      - --enable-shared
      - --disable-static
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
        sha256: 40973d44970dbc83ef302b0609f2e74982be2d85916dd2ee7472d30678a7abe6
    cleanup:
      - /share/ffmpeg

  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.11.23/yt-dlp
        sha256: e8665ed64d6b9172773e812f891fb707a0cb1ee8d9ef4fc1acb00cabee4c5256
        dest-filename: yt-dlp
        only-arches:
          - x86_64
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.11.23/yt-dlp_linux_aarch64
        sha256: fb847a2e4a9ddc8cf5fcfb4bb7f42ba8969ecf72068def0278074f9d300bd13c
        dest-filename: yt-dlp
        only-arches:
          - aarch64

  # yt-dlp needs a JavaScript runtime for YouTube; the app cannot fetch one
  # at run time inside the sandbox.
  - name: deno
    buildsystem: simple
    build-commands:
      - install -Dm755 deno /app/bin/deno
    sources:
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-unknown-linux-gnu.zip
        sha256: e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609
        strip-components: 0
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/denoland/deno/releases/download/v2.9.8/deno-aarch64-unknown-linux-gnu.zip
        sha256: d49596c20b9788cf8f5d8ddf644103d4bde56ed239753f0bdb92ba9361d51905
        strip-components: 0
        only-arches:
          - aarch64

  - name: omniget
    buildsystem: simple
    build-options:
      env:
        npm_config_cache: /run/build/omniget/flatpak-node/npm-cache
        npm_config_legacy_peer_deps: 'true'
    build-commands:
      - npm install --offline
      - node browser-extension/sync.mjs
      - npx vite build
      - cargo --offline build --release --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/omniget /app/bin/omniget
      - mkdir -p /app/lib/omniget/browser-extension
      - cp -r browser-extension/chrome browser-extension/firefox /app/lib/omniget/browser-extension/
      - test -f /app/lib/omniget/browser-extension/chrome/manifest.json
      - test -f /app/lib/omniget/browser-extension/firefox/manifest.json
      - install -Dm644 flatpak/wtf.tonho.omniget.desktop /app/share/applications/wtf.tonho.omniget.desktop
      - install -Dm644 flatpak/wtf.tonho.omniget.metainfo.xml /app/share/metainfo/wtf.tonho.omniget.metainfo.xml
      - install -Dm644 flatpak/wtf.tonho.omniget.png /app/share/icons/hicolor/128x128/apps/wtf.tonho.omniget.png
    sources:
      - type: dir
        path: ..
      - cargo-sources.json
      - node-sources.json
